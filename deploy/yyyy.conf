server {
    # 监听 3366 端口
    listen 3366;
    server_name localhost;
    
    # 强烈建议将根目录指向 public 目录
    # 注意：请将这里的 /www/wwwroot/your_project 替换为你的实际项目路径
    root /www/wwwroot/your_project/public;
    
    index index.php index.html index.htm;

    # 访问日志和错误日志路径（根据实际环境修改）
    # access_log /var/log/nginx/crmeb_access.log;
    # error_log /var/log/nginx/crmeb_error.log;

    # ThinkPHP 伪静态规则
    location / {
        if (!-e $request_filename){
            rewrite  ^(.*)$  /index.php?s=$1  last;   break;
        }
    }

    # PHP 脚本请求全部转发到 FastCGI 处理
    location ~ \.php$ {
        # FastCGI 监听地址，根据实际环境修改，常见如 127.0.0.1:9000 或 unix:/tmp/php-cgi-80.sock
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 静态资源缓存设置
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|flv|mp4|ico)$ {
        expires 30d;
        access_log off;
    }
    
    location ~ .*\.(js|css)?$ {
        expires 7d;
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}